<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lectures</title>
<meta name="description" content="Audio lecture player — your Google Drive folders as series, always resuming where you left off.">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=JSON.parse(localStorage.getItem('alp.v1'));if(t&&t.settings&&t.settings.theme)document.documentElement.dataset.theme=t.settings.theme}catch(e){}</script>
</head>

<div id="app"></div>
<div id="toast"></div>
